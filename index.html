<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bacondev123 Portal</title>
    <meta name="description" content="Centralized portal syncing repositories from bacondev123 and antigravityagent001." />
    <meta property="og:title" content="bacondev123 Portal" />
    <meta property="og:description" content="Centralized portal syncing repositories from bacondev123 and antigravityagent001." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script type="module">
      // Direct static fallback for GitHub Pages branch deployment (/root)
      if (window.location.hostname.endsWith('github.io') || window.location.protocol === 'file:') {
        setTimeout(() => {
          const root = document.getElementById('root');
          if (root && !root.hasChildNodes()) {
            import('./assets/index.js').catch(() => {});
          }
        }, 150);
      }
    </script>
  </body>
</html>
